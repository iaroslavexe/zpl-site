name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # секреты нельзя использовать в if, поэтому проверяем через env.
      # Поддерживаем и secret, и variable — чтобы не спотыкаться на том,
      # куда именно добавили токен.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Сборка статики
        run: python -m app.build

      - name: Проверка доступа к Cloudflare
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "токен найден — деплой будет выполнен"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN не найден — деплой пропущен"
          fi

      - name: Деплой на Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zpl-site --branch=main
